<!--
  GTM Custom HTML Tag — "Registration Modal"
  ==========================================
  Version-controlled copy of a tag that lives in Google Tag Manager. This file
  is NOT loaded by the site; paste its contents into the Custom HTML tag body
  and keep the two in sync.

  Behaviour:
    - Auto-opens the modal AUTO_OPEN_DELAY_MS after the tag fires (5s).
    - Dismissing it (×, backdrop, Esc, or the app's own close button) collapses
      it to the amber #registration-sticky tab on the right edge.
    - Clicking that tab re-opens the same modal.
    - The tab's own × hides it for the rest of the session.

  Requires #flutter-modal-container and #registration-sticky in web/index.html.
  The Flutter side of the contract is lib/core/web/parent_modal_bridge.dart —
  CLOSE_MESSAGE and the trusted origin must match on both ends.

  Tag settings:
    - Type:    Custom HTML
    - Trigger: DOM Ready (All Pages). No click trigger — the popup is timed.
    - Leave "Support document.write" UNCHECKED.
-->
<script>
  (function () {
    'use strict';

    // ── Configuration ──────────────────────────────────────────────────────
    // Two required parts of this URL, both easy to lose:
    //   app=1            → index.html auto-calls enterApp(), so the iframe
    //                      boots the Flutter engine instead of rendering the
    //                      marketing landing overlay inside the modal.
    //   #/store-register → the app uses hash routing (no usePathUrlStrategy),
    //                      and the route is /store-register, not /registration.
    // buildUrl() appends &embed=1 before the '#'.
    var APP_URL = 'https://mypocketpos.in/?app=1#/store-register';
    // Origins allowed to send us the close signal. Scheme + host (+ port), no
    // trailing slash — compared against event.origin.
    var TRUSTED_ORIGINS = ['https://mypocketpos.in'];
    var CLOSE_MESSAGE = 'close_registration_modal';
    var AUTO_OPEN_DELAY_MS = 5000;
    // Session key for "user dismissed the tab, stop nagging".
    var DISMISS_KEY = 'pocketpos_reg_dismissed';

    var container = document.getElementById('flutter-modal-container');
    var content = document.getElementById('flutter-modal-content');
    var tab = document.getElementById('registration-sticky');
    if (!container || !content || !tab) return; // markup missing — fail silently

    // The tag can fire more than once per page. Everything below is idempotent,
    // and listeners plus the auto-open timer are set up only on the first run.
    var state = window.__pocketPosModal;
    var firstRun = !state;
    if (firstRun) state = window.__pocketPosModal = { lastFocus: null };

    // sessionStorage throws in some privacy modes, so it is always guarded.
    function isDismissed() {
      try { return sessionStorage.getItem(DISMISS_KEY) === '1'; }
      catch (e) { return false; }
    }
    function rememberDismissed() {
      try { sessionStorage.setItem(DISMISS_KEY, '1'); } catch (e) { }
    }

    function buildUrl() {
      var hash = '';
      var url = APP_URL;
      var h = url.indexOf('#');
      if (h !== -1) {
        hash = url.slice(h);
        url = url.slice(0, h);
      }
      return url + (url.indexOf('?') === -1 ? '?' : '&') + 'embed=1' + hash;
    }

    function ensureIframe() {
      // Reuse the existing frame so repeat opens don't stack iframes — and so
      // collapsing to the tab keeps a part-filled form intact.
      var iframe = document.getElementById('flutter-app-iframe');
      if (iframe) return iframe;

      iframe = document.createElement('iframe');
      iframe.id = 'flutter-app-iframe';
      iframe.src = buildUrl();
      iframe.title = 'Register your store';
      iframe.setAttribute('loading', 'lazy');
      iframe.setAttribute('allow', 'clipboard-write; camera');
      // No `sandbox`: the Flutter app signs in with Firebase Auth, which needs
      // same-origin access to IndexedDB. A sandbox without allow-same-origin
      // breaks login; one with it grants little, since the frame is first-party.
      content.appendChild(iframe);
      return iframe;
    }

    function openModal() {
      if (container.classList.contains('is-open')) return;
      ensureIframe();
      state.lastFocus = document.activeElement;
      tab.hidden = true;                       // modal and tab are exclusive
      container.classList.add('is-open');
      container.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      var closeBtn = document.getElementById('close-flutter-modal');
      if (closeBtn) closeBtn.focus();
    }

    // Every dismissal path lands here: hide the modal, leave the tab behind.
    function collapseToTab() {
      if (!container.classList.contains('is-open')) return;
      container.classList.remove('is-open');
      container.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      if (!isDismissed()) {
        tab.hidden = false;
        // Move focus to the tab so keyboard users aren't dropped at the top of
        // the document.
        var openBtn = document.getElementById('registration-sticky-open');
        if (openBtn) openBtn.focus();
      } else if (state.lastFocus && typeof state.lastFocus.focus === 'function') {
        state.lastFocus.focus();
      }
      state.lastFocus = null;
    }

    function dismissTab() {
      tab.hidden = true;
      rememberDismissed();
    }

    if (firstRun) {
      // ── Close signal from inside the Flutter app ────────────────────────
      window.addEventListener('message', function (event) {
        // 1. Origin must be on the allowlist. Never trust event.data alone.
        if (TRUSTED_ORIGINS.indexOf(event.origin) === -1) return;

        // 2. The message must come from our iframe, not another frame that
        //    happens to sit on a trusted origin.
        var iframe = document.getElementById('flutter-app-iframe');
        if (!iframe || event.source !== iframe.contentWindow) return;

        // 3. Accept a bare string or {type:'...'} so the Flutter side can
        //    evolve to a richer payload without breaking this tag.
        var data = event.data;
        var message = typeof data === 'string'
          ? data
          : (data && typeof data === 'object' ? data.type : null);
        if (message !== CLOSE_MESSAGE) return;

        collapseToTab();
      }, false);

      // ── Dismissal from the parent page ──────────────────────────────────
      var closeBtn = document.getElementById('close-flutter-modal');
      if (closeBtn) closeBtn.addEventListener('click', collapseToTab);

      // Backdrop click — only when the backdrop itself is the target, so a
      // click that started inside the card doesn't dismiss it.
      container.addEventListener('click', function (event) {
        if (event.target === container) collapseToTab();
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' || event.keyCode === 27) collapseToTab();
      });

      // ── The collapsed tab ───────────────────────────────────────────────
      var tabOpen = document.getElementById('registration-sticky-open');
      if (tabOpen) tabOpen.addEventListener('click', openModal);

      var tabDismiss = document.getElementById('registration-sticky-dismiss');
      if (tabDismiss) tabDismiss.addEventListener('click', dismissTab);

      // ── Timed auto-open ─────────────────────────────────────────────────
      if (!isDismissed()) {
        window.setTimeout(function () {
          // Re-check: the visitor may have dismissed it during the delay.
          if (!isDismissed()) openModal();
        }, AUTO_OPEN_DELAY_MS);
      }

      // Let other tags / page code drive the modal too.
      window.pocketPosOpenRegistration = openModal;
      window.pocketPosCloseRegistration = collapseToTab;
    }
  })();
</script>
