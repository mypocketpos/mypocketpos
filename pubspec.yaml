name: pocket_pos
description: Offline-first Kirana POS system built with Flutter, Drift, and Riverpod.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^6.0.4
  esc_pos_utils_plus: ^2.0.4
  flutter_blue_plus: ^1.35.5
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.16.0
  unified_esc_pos_printer: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.1
  riverpod_generator: ^2.4.2
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
